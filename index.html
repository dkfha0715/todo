<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
/* 홈 화면 아이콘 색: Safari는 페이지를 처음 읽을 때의 manifest·아이콘 링크로 홈 화면 앱을 만든다.
   그래서 저장된 색을 읽어 처음부터 그 색의 링크를 넣는다. 저장된 색이 없으면(처음 실행) 하얀색. */
(function(){var k='white';try{var j=JSON.parse(localStorage.getItem('todo-board-v3'));if(j&&j.set&&/^(white|sky|black|gray)$/.test(j.set.icon))k=j.set.icon}catch(e){}
document.write('<link rel="manifest" id="mfst" href="manifest-'+k+'.webmanifest"><link rel="apple-touch-icon" id="ati" sizes="180x180" href="icons/apple-touch-icon-'+k+'.png"><link rel="icon" id="fav" type="image/png" href="icons/apple-touch-icon-'+k+'.png">');window.ICON_AT_LOAD=k})();
</script>
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#ffffff">
<title>To Do</title>
<style>
:root{--navy:#1f3b57;--navy2:#2c4a68;--bg:#fafafa;--gray:#8e8e93;--sep:#e5e5ea;--sel:#aeb8c2;--txt:#2c3744;--shadow:0 4px 18px rgba(30,50,70,.10);--green:#34c759;--red:#ff3b30;--ease:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;overscroll-behavior:none;touch-action:manipulation}
#stage{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#fff;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;cursor:default;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;--W:1180px;--sbw:clamp(300px,calc(var(--W)*.27),340px)}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default}
button:active{opacity:.5}
svg{width:1em;height:1em;display:block;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.app{position:absolute;inset:0;display:flex;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
/* 홈 화면 설치 안내 (Safari에서만) */
#inst{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;bottom:calc(76px + env(safe-area-inset-bottom));z-index:90;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 16px;border-radius:18px;background:rgba(255,255,255,.97);box-shadow:0 8px 30px rgba(30,50,70,.18);font:14px/1.35 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#2c3744;-webkit-user-select:none;user-select:none}
#inst[hidden]{display:none}
#inst svg{width:18px;height:18px;flex:0 0 auto;stroke:#1f3b57;stroke-width:1.6}
#inst span{flex:1;min-width:0}
#inst button{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:#f1f3f5;color:#8e8e93;font-size:18px;line-height:30px;text-align:center}
/* ---------- sidebar ---------- */
.sidebar{flex:0 0 var(--sbw);width:var(--sbw);margin:12px 0 12px 10px;background:#fafafa;border-radius:28px;box-shadow:var(--shadow);overflow:hidden;z-index:6;border:1px solid #f0f1f2;transition:flex-basis .34s var(--ease),margin .34s var(--ease),opacity .25s,transform .34s var(--ease)}
.app.nosb .sidebar{flex-basis:0;margin-left:0;opacity:0;pointer-events:none;border-width:0}
.sbi{width:calc(var(--sbw) - 2px);height:100%;display:flex;flex-direction:column;padding:10px 12px 10px}
.sb-top{display:flex;align-items:center;height:44px;color:var(--navy);padding:0 4px 0 6px;flex:0 0 auto}
.sb-top .t{font-size:16.5px;color:var(--navy2)}
.sb-top .t.l{margin-left:auto;margin-right:26px;color:#3a4653}
.sb-top .t.e{margin-right:24px}
.sb-top .ok{font-size:30px;color:#000;margin-right:14px;width:34px}
.ico{font-size:23px;color:var(--navy);display:grid;place-items:center;width:40px;height:40px}
.ico.gr{color:#b8bcc2;pointer-events:none}
.sb-scroll{flex:1;overflow:auto;min-height:0;-webkit-overflow-scrolling:touch}
.sec{display:flex;align-items:center;justify-content:space-between;margin:12px 8px 0 10px;height:34px;font-size:12.5px;color:var(--navy2)}
.sec svg{font-size:15px;transition:transform .2s}
.sec.closed svg{transform:rotate(-90deg)}
.sec.grp{margin-top:6px}
.item{display:flex;align-items:center;height:44px;padding:0 14px 0 14px;border-radius:12px;font-size:15.5px;gap:14px;color:var(--txt);flex:1;min-width:0}
.item.sel{background:var(--sel)}
.item .ci{font-size:17px;color:var(--navy);flex:0 0 auto}
.item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .cnt{font-size:15px;min-width:20px;text-align:right}
.item.sp{height:36px}
.spc{height:22px}
.erow{display:flex;align-items:center;gap:10px;position:relative;background:var(--bg)}
.erow.faded{opacity:.45}
.erow .sec{flex:1;margin:0;height:44px}
.minus{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--red);position:relative;margin-left:6px}
.minus::after{content:"";position:absolute;left:5px;right:5px;top:9px;height:2px;background:#fff;border-radius:1px}
.minus.plus{background:var(--green)}
.minus.plus::before{content:"";position:absolute;top:5px;bottom:5px;left:9px;width:2px;background:#fff;border-radius:1px}
.hd{flex:0 0 auto;width:30px;height:30px;color:#b4b4b9;font-size:22px;display:grid;place-items:center;touch-action:none}
.hd svg{stroke-width:1.5}
.sb-bot{display:flex;align-items:center;justify-content:space-between;color:var(--navy);padding:4px 6px 0;flex:0 0 auto;height:42px}
.sb-bot .ico{font-size:22px}
.sb-bot.ed{font-size:15.5px;padding:0 8px}
.sb-bot.ed button{color:var(--navy)}
/* ---------- main ---------- */
.main{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;padding-bottom:62px}
.hdr{height:74px;flex:0 0 auto;position:relative}
.hdr h1{position:absolute;left:0;right:0;top:22px;margin:0;text-align:center;font-size:17px;font-weight:500;color:#444f5b;line-height:24px}
.later{position:absolute;left:0;right:0;top:46px;font-size:11.5px;color:var(--gray);text-align:center}
.pill{position:absolute;top:12px;background:rgba(255,255,255,.96);border-radius:22px;box-shadow:var(--shadow);height:43px;display:flex;align-items:center;z-index:3}
.pill.l{left:12px;width:43px;justify-content:center}
.app:not(.nosb) .pill.l{display:none}
.pill.r{right:12px;padding:0 6px;gap:2px}
.pill .ico{font-size:21px;width:42px;height:40px}
.pill .ico.off{opacity:.35}
.pill .ico.dots svg{stroke-width:1}
.view{flex:1;min-height:0;position:relative}
.view.board{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:0 10px 0 10px;scroll-padding-left:10px;scrollbar-width:none;--cw:clamp(280px,calc(var(--W)*.296),520px);-webkit-overflow-scrolling:touch}
.mob .view.board{--cw:84%}
.ovl .view.board{--cw:calc(var(--W)*.47)}
.view::-webkit-scrollbar,.card::-webkit-scrollbar,.cscroll::-webkit-scrollbar,.sb-scroll::-webkit-scrollbar{display:none}
.col{flex:0 0 var(--cw);display:flex;flex-direction:column;min-height:0;scroll-snap-align:start}
.ch{display:flex;align-items:center;gap:7px;padding:0 20px 0;font-size:15px;white-space:nowrap;height:28px;margin-bottom:4px}
.ch b{font-weight:500;color:#4a5560}
.ch span{color:var(--gray)}
.ch i{margin-left:auto;font-style:normal;color:var(--gray)}
.card{flex:1;min-height:0;border:1px solid #e9ebed;border-radius:26px;background:#fff;overflow-y:auto;padding:14px 8px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:14px;min-height:44px;padding:0 12px;border-radius:12px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.row:active{background:#f4f6f8}
.row.lp{background:#eef1f4;transform:scale(.985);transition:transform .15s}
.circ{flex:0 0 auto;width:19px;height:19px;border-radius:50%;border:1.5px solid var(--navy);display:grid;place-items:center}
.circ i{display:none;width:11px;height:11px;border-radius:50%;background:var(--navy)}
.row.done .circ i{display:block}
.row.done .tt{color:#9da3a9}
.rb{flex:1;min-width:0;padding:7px 0}
.tt{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#2f3b48}
.sub2{font-size:11px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pr{font-weight:700;font-size:15px;letter-spacing:-1px}
.pr.p1{color:#6d8aa6}.pr.p2{color:#3f6188}.pr.p3{color:#d9483b}
.tm{font-size:11px;color:var(--gray)}
.row.doing{box-shadow:inset 3px 0 0 var(--navy)}
.add{margin:40px auto 0;font-size:20px;color:#8fa0b0;width:36px;height:36px;display:grid;place-items:center}
.add svg{stroke-width:1.1}
.dots{display:flex;justify-content:center;align-items:center;gap:11px;height:34px;flex:0 0 auto}
.dots button{width:6px;height:6px;border-radius:50%;background:#c9c9ce;transition:background .15s}
.dots button.on{background:#000}
.dots button:last-child{width:4px;height:4px}
.tool{position:absolute;left:10px;bottom:12px;background:rgba(255,255,255,.96);border-radius:25px;box-shadow:var(--shadow);height:50px;display:flex;align-items:center;gap:22px;padding:0 11px;z-index:3}
.tool .ico{font-size:20px;width:38px;height:38px;border-radius:50%}
.tool .ico.on{background:#b6bfc8;color:#eef1f4}
.fab{position:absolute;right:12px;bottom:12px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.96);box-shadow:var(--shadow);display:grid;place-items:center;font-size:22px;color:var(--navy);z-index:3}
.fab svg{stroke-width:1.3}
/* list views */
.view.list,.view.w7,.view.d1{overflow-y:auto;padding:0 6%;-webkit-overflow-scrolling:touch}
.lwrap{max-width:720px;margin:0 auto;padding-bottom:30px}
.lh{display:flex;align-items:baseline;gap:8px;padding:20px 6px 6px;border-bottom:1px solid #d1d1d6;font-size:14.5px}
.lh b{font-weight:600;color:#3a4653}.lh span{color:var(--gray)}
.lh i{margin-left:auto;font-style:normal;color:var(--gray)}
.lwrap .row{border-radius:0;border-bottom:1px solid var(--sep);min-height:46px;padding:0 6px}
.ladd{display:flex;align-items:center;gap:8px;padding:11px 6px;color:#8fa0b0;font-size:14px}
.ladd svg{font-size:18px}
.dayn{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px;border-bottom:1px solid #d1d1d6}
.dayn b{font-size:16px;font-weight:600;color:#3a4653}
.dayn button{font-size:22px;width:40px;height:36px;display:grid;place-items:center;color:var(--navy)}
/* calendar */
.view.cal{display:flex;flex-direction:column}
.calbar{display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 14px;height:30px;font-size:16px;color:#5a6470;flex:0 0 auto}
.calbar button{font-size:14px;color:#9a9ea4}
.cwk{display:grid;grid-template-columns:repeat(7,1fr);font-size:10.5px;color:#a3a7ac;text-align:center;height:20px;line-height:20px;background:#f7f7f8;flex:0 0 auto}
.cscroll{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch;padding-bottom:70px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);height:108px;border-top:1px solid #e8e8ea}
.wk.mb{border-top:2px solid #e2e2e5}
.cd{overflow:hidden;min-width:0;padding-top:6px}
.cd.we{background:#f7f7f8}
.cd.f{border-left:1.5px solid #e6e6e9}
.cd .n{display:block;text-align:center;font-size:13px;color:#4a5560;height:20px;line-height:20px;margin-bottom:3px}
.cd .n.td{display:block;width:fit-content;margin:0 auto 3px;background:var(--navy);color:#fff;border-radius:10px;padding:0 8px;font-size:12px}
.cd .n.f{font-size:12px;color:#5a6470}
.cchip{display:flex;align-items:center;gap:3px;height:17px;font-size:10px;line-height:17px;margin:0 0 2px;padding:0 3px;background:#dfe4ea;color:#3a4653;white-space:nowrap;overflow:hidden;border-radius:2px;-webkit-touch-callout:none}
.cchip.dn{background:#e8e8ea;color:#6c727a}
.cchip svg{width:8px;height:8px;flex:0 0 auto;stroke-width:1.6}
.cchip span{overflow:hidden;text-overflow:ellipsis}
.cmore{font-size:10px;color:var(--gray);padding:0 3px}
/* ---------- modal ---------- */
.ov{position:absolute;inset:0;background:rgba(150,158,158,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;justify-content:center;align-items:center;z-index:20;animation:fi .25s}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.modal{width:79%;max-width:960px;height:89%;background:#fff;border-radius:34px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.18);animation:up .42s var(--ease)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 0;position:relative;min-height:62px;flex:0 0 auto}
.mh h2{position:absolute;left:0;right:0;text-align:center;margin:0;font-size:16px;font-weight:500;color:#444f5b;pointer-events:none}
.rb2{width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 3px 12px rgba(30,50,70,.13);display:grid;place-items:center;font-size:19px;color:#222;z-index:1}
.rb2.ok{background:#c8c8c8;color:#fff;box-shadow:none;font-size:22px}.rb2.ok.ready{background:var(--navy)}
.mscroll{overflow:auto;flex:1;display:flex;flex-direction:column;min-height:0;-webkit-overflow-scrolling:touch}
.trow{display:flex;align-items:center;gap:14px;padding:6px 20px 14px;min-height:56px}
.trow .c2{flex:0 0 auto;width:19px;height:19px;border-radius:50%;border:1.5px solid var(--navy);display:grid;place-items:center}
.trow .c2 i{display:none;width:11px;height:11px;border-radius:50%;background:var(--navy)}
.trow .c2.on i{display:block}
.trow input{flex:1;border:0;outline:0;font-size:17px;font-family:inherit;color:#2b3a4a;background:none;min-width:0}
.subline{background:#fafafa;padding:0 20px 0 53px;font-size:11.5px;color:var(--navy2);display:flex;align-items:center;gap:6px;min-height:24px;flex-wrap:wrap}
.subline svg{font-size:11px}
.memo{display:flex;gap:8px;padding:16px 20px 0;color:var(--gray);font-size:15px;flex:1 1 auto;min-height:70px}
.memo svg{font-size:13px;color:var(--navy);margin-top:4px;flex:0 0 auto}
.memo textarea{flex:1;border:0;outline:0;resize:none;font:inherit;color:#444;height:100%;background:none}
.exp{align-self:flex-end;margin:0 20px 8px;font-size:16px;color:var(--navy)}
.qg{background:#fafafa}
.qr{display:flex}
.qc{flex:0 0 10.7%;min-width:0;height:80px;background:#fff;border:1px solid #eee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:14px;white-space:nowrap;color:#3a4653;padding:4px;text-align:center;line-height:1.2}
.qc small{font-size:10px;color:#b0b4b8;min-height:12px}
.qc:active{background:#f2f5f8;opacity:1}
.qc.act{color:var(--navy);font-weight:600}
.dl{padding:16px 20px 0;font-size:15px;color:#a8adb2;display:flex;flex-direction:column;gap:9px;min-height:66px}
.dl div{display:flex;align-items:center;gap:10px}
.dl svg{font-size:11px;color:var(--navy)}
.dl .off{color:#c7cbcf}
.icons{display:flex;justify-content:flex-end;gap:16px;padding:6px 20px}
.icons button{width:28px;height:28px;border-radius:50%;background:#f1f3f5;display:grid;place-items:center;font-size:15px;color:var(--navy)}
.icons button.on{background:var(--navy);color:#fff}
.icons .auto{font-size:9px;font-weight:700}
.prow{display:flex;align-items:center;padding:8px 20px}
.prio{display:flex}
.prio button{width:48px;height:34px;font-size:16px;font-weight:700;color:var(--navy);border-radius:17px;letter-spacing:-1px}
.prio button:first-child{color:#a0a4a9;font-weight:400}
.prio button.on{background:#e8edf2}
.chip{margin-left:auto;display:flex;align-items:center;gap:9px;background:#f4f5f6;border-radius:18px;height:34px;padding:0 16px;font-size:17px;color:#444}
.chip i{width:11px;height:11px;border-radius:50%;background:var(--navy)}
.subs{padding:8px 20px 0}
.sr{display:flex;align-items:center;gap:12px;min-height:38px;font-size:15px}
.sr .sc{width:17px;height:17px;border:1.5px solid var(--navy);border-radius:50%;display:grid;place-items:center}
.sr .sc i{display:none;width:9px;height:9px;border-radius:50%;background:var(--navy)}
.sr.on .sc i{display:block}.sr.on span{color:var(--gray);text-decoration:line-through}
.sr span{flex:1}
.sr .x{color:#b9bec3;font-size:14px}
.addsub{display:flex;align-items:center;gap:14px;padding:6px 20px 16px;color:var(--navy)}
.addsub>svg{font-size:20px}
.addsub input{flex:1;border:0;outline:0;font:inherit;font-size:15px;background:none;color:#444}
.addsub input::placeholder{color:#aeb3b8}
.addsub .rc{font-size:17px}
.mfoot{background:#fafafa;flex:1 0 24px;min-height:24px;display:flex;justify-content:center;align-items:center;padding:8px}
.delb{color:var(--red);font-size:15.5px;padding:10px 22px}
/* ---------- iOS alert / action sheet / settings ---------- */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.28);display:grid;place-items:center;z-index:50;animation:fi .2s;padding:16px}
.alert{width:min(270px,90%);background:rgba(250,250,250,.94);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.25);animation:pop .22s var(--ease)}
@keyframes pop{from{transform:scale(1.1);opacity:0}to{transform:none;opacity:1}}
.ab{padding:18px 16px 16px;text-align:center}
.ab h3{margin:0;font-size:17px;font-weight:600;color:#000}
.ab p{margin:4px 0 0;font-size:13px;color:#000;line-height:1.35;white-space:pre-line}
.ab input{margin-top:14px;width:100%;font:inherit;font-size:13px;padding:6px 8px;border:.5px solid #c6c6c8;border-radius:6px;outline:0;background:#fff}
.abt{display:flex;border-top:.5px solid rgba(60,60,67,.3)}
.abt button{flex:1;height:44px;font-size:17px;color:var(--navy)}
.abt button+button{border-left:.5px solid rgba(60,60,67,.3);font-weight:600}
.abt button.dng{color:var(--red)}
.abt button:active{opacity:1;background:rgba(0,0,0,.08)}
.asw{width:min(340px,92%);max-height:88%;display:flex;flex-direction:column;gap:8px;animation:pop .22s var(--ease)}
.actsheet{background:rgba(250,250,250,.94);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:0;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.as-h{padding:13px 16px 10px;text-align:center;font-size:13px;color:var(--gray);border-bottom:.5px solid rgba(60,60,67,.2)}
.as-h b{display:block;color:#000;font-size:14px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as-l{overflow:auto}
.as-i{display:flex;align-items:center;gap:10px;width:100%;height:48px;padding:0 18px;font-size:17px;color:#000;border-top:.5px solid rgba(60,60,67,.2);text-align:left}
.as-l .as-i:first-child{border-top:0}
.as-i span{flex:1}
.as-i small{color:var(--gray);font-size:14px}
.as-i svg{font-size:18px;color:var(--navy)}
.as-i.red{color:var(--red)}
.as-i:active{background:rgba(0,0,0,.07);opacity:1}
.as-c{background:rgba(250,250,250,.96);border-radius:14px;height:50px;font-size:17px;font-weight:600;color:var(--navy);flex:0 0 auto}
.setp{width:min(92%,540px);height:84%;background:#f2f2f7;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:up .42s var(--ease)}
.setp header{display:flex;align-items:center;justify-content:center;position:relative;height:52px;flex:0 0 auto;background:rgba(242,242,247,.95)}
.setp header h2{margin:0;font-size:17px;font-weight:600;color:#000}
.setp header button{position:absolute;right:16px;font-size:17px;font-weight:600;color:var(--navy)}
.setb{flex:1;overflow:auto;padding:0 16px 30px;-webkit-overflow-scrolling:touch}
.sg{margin:24px 0 0}

.icsw{display:flex;gap:18px;padding:14px 16px;justify-content:center}.icsw button{width:58px;height:58px;border-radius:14px;box-shadow:0 0 0 1px rgba(0,0,0,.14);position:relative}.icsw button.on{box-shadow:0 0 0 3px #fff,0 0 0 5px #007aff}.icsw span{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:9px;font-size:11px;color:#6d6d72;white-space:nowrap}.icsw{padding-bottom:30px}
.sg p{margin:7px 16px 0;font-size:12.5px;color:#6d6d72;line-height:1.4}
.sr2{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 16px;font-size:17px;color:#000;width:100%;text-align:left;position:relative}
.sr2:active{background:#d9d9de;opacity:1}
.sr2+.sr2::before{content:"";position:absolute;left:16px;right:0;top:0;border-top:.5px solid rgba(60,60,67,.29)}
.sr2 span{flex:1}
.sr2 em{font-style:normal;color:var(--gray);font-size:17px}
.sr2 svg{font-size:15px;color:#c4c4c7;transform:rotate(-90deg);stroke-width:2}
.sr2.red{color:var(--red)}
.sw{width:51px;height:31px;border-radius:16px;background:#e9e9ea;position:relative;flex:0 0 auto;transition:background .25s}
.sw:active{opacity:1}
.sw i{position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .25s var(--ease)}
.sw.on{background:var(--green)}.sw.on i{transform:translateX(20px)}
.seg{display:flex;background:#eeeef0;border-radius:9px;padding:2px;margin:8px 12px;width:calc(100% - 24px)}
.seg button{flex:1;height:30px;border-radius:7px;font-size:13px}
.seg button.on{background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
.toast{position:absolute;left:50%;top:22px;transform:translateX(-50%);background:rgba(40,40,44,.92);color:#fff;padding:11px 20px;border-radius:22px;font-size:14px;z-index:80;box-shadow:0 8px 30px rgba(0,0,0,.25);white-space:nowrap;animation:fi .2s}
.hid{position:fixed;left:0;top:0;opacity:0;pointer-events:none;width:1px;height:1px}
/* 시각 선택 창 (오전/오후 · 시 · 분) */
.tp{width:min(320px,92%);background:rgba(248,248,250,.97);border-radius:16px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.25);animation:pop .22s var(--ease)}
.tp h3{margin:0;padding:16px 16px 4px;text-align:center;font-size:17px;font-weight:600;color:#000}
.tpw{position:relative;display:flex;justify-content:center;gap:4px;height:180px;margin:6px 12px 10px}
.tpw::before{content:'';position:absolute;left:0;right:0;top:72px;height:36px;border-radius:9px;background:rgba(118,118,128,.12);pointer-events:none}
.tpw::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(248,248,250,.95),rgba(248,248,250,0) 38%,rgba(248,248,250,0) 62%,rgba(248,248,250,.95))}
.tpc{width:72px;height:180px;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:72px 0}
.tpc::-webkit-scrollbar{display:none}
.tpc div{height:36px;line-height:36px;text-align:center;font-size:21px;color:#000;scroll-snap-align:center;font-variant-numeric:tabular-nums}
.tpc.ap div{font-size:18px}
.tpb{display:flex;border-top:.5px solid rgba(60,60,67,.29)}
.tpb button{flex:1;height:46px;font-size:17px;color:#007aff}
.tpb button+button{border-left:.5px solid rgba(60,60,67,.29);font-weight:600}
.ovl .sidebar{position:absolute;left:0;top:0;bottom:0;width:380px;margin:12px;flex:none;box-shadow:0 10px 40px rgba(0,0,0,.18)}.ovl .sbi{width:100%}.ovl.nosb .sidebar{transform:translateX(-115%)}
.ovl .modal{height:60%;width:90%}.ovl .qc{flex:1 1 0;height:76px}.ovl .wk{height:130px}
.mob .sidebar{position:absolute;left:0;top:0;bottom:0;width:86%;max-width:380px;margin:10px;flex:none}
.mob .sbi{width:100%}
.mob.nosb .sidebar{transform:translateX(-115%);opacity:1}
.mob .modal{border-radius:26px;height:96%;width:96%}
.mob .qc{flex:1 1 0;font-size:12.5px;height:68px}
.mob .prio button{width:44px}
.mob .wk{height:96px}
</style>

<body>
<div id="stage">
 <div class="app" id="app">
  <aside class="sidebar" id="sb"></aside>
  <section class="main">
   <div class="pill l"><button class="ico" id="sbOpen" aria-label="사이드바"></button></div>
   <div class="hdr"><h1 id="title">모든 리스트</h1><button class="later" id="later" hidden></button></div>
   <div class="pill r"><button class="ico" id="btnDone" aria-label="완료 항목 표시"></button><button class="ico dots" id="btnMore" aria-label="더보기"></button></div>
   <div class="view" id="view"></div>
   <div class="dots" id="dots"></div>
   <div class="tool" id="tool"></div>
   <button class="fab" id="btnAdd" aria-label="새 할일"></button>
  </section>
 </div>
</div>
<input class="hid" type="date" id="pDate"><input class="hid" type="time" id="pTime"><input class="hid" type="file" id="pFile" accept=".json,application/json">
<script>
/* iOS 설정(gearshape)과 비슷한 8톱니 기어 */
function gearSVG(){
 const n=8,R=9.8,r=7.7,cx=12,cy=12,tw=.17,bw=.27;
 const P=(rad,a)=>[(cx+rad*Math.sin(a)).toFixed(2),(cy-rad*Math.cos(a)).toFixed(2)];
 let d='';
 for(let i=0;i<n;i++){
  const a=i*2*Math.PI/n,na=(i+1)*2*Math.PI/n;
  const p1=P(r,a-bw),p2=P(R,a-tw),p3=P(R,a+tw),p4=P(r,a+bw),nx=P(r,na-bw);
  d+=(i?'L':'M')+p1.join(' ')+'L'+p2.join(' ')+'L'+p3.join(' ')+'L'+p4.join(' ')+'A'+r+' '+r+' 0 0 1 '+nx.join(' ');
 }
 return '<svg viewBox="0 0 24 24"><path d="'+d+'Z"/><circle cx="12" cy="12" r="3.3"/></svg>';
}
const IC={
gear:gearSVG(),
side:'<svg viewBox="0 0 24 24"><rect x="2.5" y="4.5" width="19" height="15" rx="3.5"/><path d="M9.5 4.5v15M5.2 8.5h1.8M5.2 11.5h1.8"/></svg>',
chev:'<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
left:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
right:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
up:'<svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7" stroke-width="1.8"/></svg>',
chk:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M7.4 12.4l3.2 3.1 6-6.4"/></svg>',
doc:'<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
plus:'<svg viewBox="0 0 24 24"><path d="M12 3.5v17M3.5 12h17"/></svg>',
rec:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.8" fill="currentColor" stroke="none"/></svg>',
dots:'<svg viewBox="0 0 24 24"><circle cx="4.5" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="19.5" cy="12" r="2" fill="currentColor" stroke="none"/></svg>',
lines:'<svg viewBox="0 0 24 24"><path d="M3.5 7h17M3.5 12h17M3.5 17h17" stroke-width="1.8"/></svg>',
l7:'<svg viewBox="0 0 24 24"><path d="M3 6.5h14M3 11.5h11M3 16.5h8" stroke-width="1.8"/><text x="14.2" y="21.5" font-size="11" font-weight="700" fill="currentColor" stroke="none" font-style="italic">7</text></svg>',
l1:'<svg viewBox="0 0 24 24"><path d="M3 6.5h14M3 11.5h11M3 16.5h8" stroke-width="1.8"/><text x="14.2" y="21.5" font-size="11" font-weight="700" fill="currentColor" stroke="none" font-style="italic">1</text></svg>',
calf:'<svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16.5" rx="4"/><path d="M3.5 8a4 4 0 014-4h9a4 4 0 014 4v2.5h-17z" fill="currentColor"/></svg>',
sq:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4.8"/></svg>',
x:'<svg viewBox="0 0 24 24"><path d="M5.5 5.5l13 13M18.5 5.5l-13 13"/></svg>',
ok:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
okb:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke-width="2"/></svg>',
spk:'<svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L13 19V5L7.5 9.5z" fill="currentColor"/></svg>',
spko:'<svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L13 19V5L7.5 9.5z"/></svg>',
rep:'<svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 11-2.2-5.1"/><path d="M19.5 3.5V8H15"/></svg>',
tag:'<svg viewBox="0 0 24 24"><path d="M3.5 12.5V4.5a1 1 0 011-1h8l8 8-9 9z"/><circle cx="8.5" cy="8.5" r="1.3"/></svg>',
pin:'<svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 005 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
clip:'<svg viewBox="0 0 24 24"><path d="M20 11l-8.5 8.5a5 5 0 01-7-7L13 4a3.3 3.3 0 014.7 4.7L9.2 17.2a1.7 1.7 0 01-2.4-2.4L14 7.6"/></svg>',
exp:'<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
calm:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3.5"/><path d="M4 10h16" stroke-width="2.6"/></svg>',
grip:'<svg viewBox="0 0 24 24"><path d="M4 8h16M4 12h16M4 16h16" stroke-width="1.4"/></svg>',
chk2:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke-width="3"/></svg>',
ring:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" stroke-width="3"/></svg>'
};
const $=s=>document.querySelector(s);
const stage=$('#stage');
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const DOW='일월화수목금토';
const dow=s=>DOW[parse(s).getDay()];
const mondayOf=s=>addDays(s,-((parse(s).getDay()+6)%7));
const rel=s=>{const n=diff(s,today());return n===0?'오늘':n===1?'내일':n===-1?'어제':n>1?n+'일 후':(-n)+'일 전'};
const md=s=>{const d=parse(s);return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DOW[d.getDay()]+')'};
const dfmt=s=>{const x=parse(s);return x.getFullYear()+'. '+(x.getMonth()+1)+'. '+x.getDate()+'.'};
const t12=t=>{if(!t)return'';let[h,m]=t.split(':').map(Number);const ap=h<12?'오전':'오후';h=h%12||12;return ap+' '+h+':'+pad(m)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const NODATE='예정완료일 없음';
const KEY='todo-board-v3';
let S={tasks:[],lists:[{id:'todo',name:'To do'}],sel:'all',sb:true,edit:false,closed:{},
 set:{showDone:true,showMemo:false,alarmOn:true,alarmAt:'09:00',icon:'white',mode:'board',hide:{}},mode:'board',daySel:null,calInit:false};
let Z=1,W=1180,H=820,MOB=false;
const LISTS=()=>S.lists.filter(l=>!l.type);
/* ---------- fit to iPad ---------- */
function fit(){
 const w=innerWidth,h=innerHeight;MOB=w<600;const PORT=!MOB&&h>w;
 Z=(MOB||PORT)?1:Math.max(.6,Math.min(1.5,Math.min(w/1180,h/820)));
 W=w/Z;H=h/Z;
 stage.style.width=W+'px';stage.style.height=H+'px';stage.style.transform='scale('+Z+')';stage.style.setProperty('--W',W+'px');
 $('#app').classList.toggle('mob',MOB);$('#app').classList.toggle('ovl',PORT);
 updDots();
}
/* ---------- storage ---------- */
function load(){
 try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&Array.isArray(j.tasks)){S.tasks=j.tasks;if(j.lists&&j.lists.length)S.lists=j.lists;Object.assign(S.set,j.set||{});if(!S.set.hide)S.set.hide={};return}}catch(e){}
 const t=today();S.tasks=[{id:uid(),c:1,title:'화분정리',date:t,time:'13:37',priority:0,list:'todo',done:true},{id:uid(),c:2,title:'옷정리',date:t,time:'13:37',priority:0,list:'todo',done:true}];
}
function save(){try{localStorage.setItem(KEY,JSON.stringify({tasks:S.tasks,lists:S.lists,set:S.set}))}catch(e){}}
/* ---------- iOS style dialogs ---------- */
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;stage.appendChild(e);setTimeout(()=>e.remove(),2400)}
function dlg(o,cb){
 const d=document.createElement('div');d.className='dim';
 d.innerHTML='<div class="alert"><div class="ab"><h3>'+esc(o.title)+'</h3>'+(o.msg?'<p>'+esc(o.msg)+'</p>':'')+(o.input!=null?'<input value="'+esc(o.val||'')+'" placeholder="'+esc(o.input)+'">':'')+'</div><div class="abt"><button data-c>'+(o.cancel||'취소')+'</button><button data-o class="'+(o.danger?'dng':'')+'">'+(o.ok||'확인')+'</button></div></div>';
 stage.appendChild(d);const i=d.querySelector('input');if(i){i.focus();i.select()}
 const done=ok=>{d.remove();if(ok)cb(i?i.value.trim():true)};
 d.querySelector('[data-c]').onclick=()=>done(false);d.querySelector('[data-o]').onclick=()=>done(true);
 if(i)i.onkeydown=e=>{if(e.key==='Enter')done(true);if(e.key==='Escape')done(false)};
}
const ask=(label,val,cb)=>dlg({title:label,input:'',val},cb);
const confirmIOS=(title,msg,ok,cb)=>dlg({title,msg,ok,danger:true},cb);
function sheet(head,sub,items){
 const d=document.createElement('div');d.className='dim';
 d.innerHTML='<div class="asw"><div class="actsheet">'+(head?'<div class="as-h"><b>'+esc(head)+'</b>'+esc(sub||'')+'</div>':'')+'<div class="as-l"></div></div><button class="as-c">취소</button></div>';
 const l=d.querySelector('.as-l');
 items.forEach(it=>{const b=document.createElement('button');b.className='as-i'+(it.red?' red':'');b.innerHTML='<span>'+esc(it.label)+'</span>'+(it.sub?'<small>'+esc(it.sub)+'</small>':'')+(it.check?IC.ok:'');b.onclick=()=>{d.remove();it.fn()};l.appendChild(b)});
 stage.appendChild(d);
 d.querySelector('.as-c').onclick=()=>d.remove();
 d.addEventListener('mousedown',e=>{if(e.target===d)d.remove()});
}
const listName=id=>(S.lists.find(l=>l.id===id)||LISTS()[0]||{name:''}).name;
/* ---------- filter / sort ---------- */
function match(t){
 if(!S.set.showDone&&t.done)return false;
 if(S.sel==='all')return true;
 if(S.sel==='today')return t.date===today();
 return t.list===S.sel;
}
const sortT=(a,b)=>(a.done-b.done)||(b.priority-a.priority)||((a.time||'99')<(b.time||'99')?-1:(a.time||'99')>(b.time||'99')?1:0)||((a.c||0)-(b.c||0));
function setDate(t,date){t.date=date||null;save();renderAll()}
/* ---------- render: sidebar ---------- */
function renderSB(){
 const hide=S.set.hide||{};
 const cnt=f=>S.tasks.filter(t=>!t.done&&f(t)).length;
 const ed=S.edit;
 const sbtn=(id,name,c)=>{
  const hidden=!!hide[id];
  if(!ed&&hidden)return'';
  const it='<div class="item '+(S.sel===id&&!ed?'sel':'')+'" data-id="'+id+'"><span class="ci">'+IC.chk+'</span><span class="nm">'+esc(name)+'</span><span class="cnt">'+c+'</span></div>';
  return ed?'<div class="erow '+(hidden?'faded':'')+'"><button class="minus '+(hidden?'plus':'')+'" data-hide="'+id+'" aria-label="숨기기"></button>'+it+'</div>':it;
 };
 const secH=(key,label)=>{
  const h='<div class="sec '+(S.closed[key]?'closed':'')+'" data-sec="'+key+'"><span>'+label+'</span>'+IC.chev+'</div>';
  return ed?'<div class="erow"><button class="minus" data-minus-sec="'+key+'" aria-label="접기"></button>'+h+'</div>':h;
 };
 let h='<div class="sbi"><div class="sb-top"><button class="ico '+(ed?'gr':'')+'" id="gear" aria-label="설정">'+IC.gear+'</button><span class="t l">리스트</span>'+(ed?'<button class="ok" id="tEdit" aria-label="완료">'+IC.okb+'</button>':'<button class="t e" id="tEdit">편집</button>')+'<button class="ico" id="sbClose" aria-label="사이드바 닫기">'+IC.side+'</button></div><div class="sb-scroll" id="sbScroll">';
 h+=secH('s','스마트 리스트');
 if(!S.closed.s)h+=sbtn('all','모든 리스트',cnt(()=>true))+sbtn('today','오늘',cnt(t=>t.date===today()));
 h+=secH('l','리스트');
 if(!S.closed.l)S.lists.forEach(l=>{
  let inner;
  if(!l.type)inner='<div class="item '+(S.sel===l.id&&!ed?'sel':'')+'" data-id="'+l.id+'" data-list="1"><span class="ci">'+IC.chk+'</span><span class="nm">'+esc(l.name)+'</span><span class="cnt">'+cnt(t=>t.list===l.id)+'</span></div>';
  else if(l.type==='group')inner=ed?'<div class="item" data-id="'+l.id+'" data-group="1" style="font-size:12.5px;color:var(--navy2)"><span class="nm">'+esc(l.name)+'</span></div>':'<div class="sec grp"><span>'+esc(l.name)+'</span></div>';
  else inner=ed?'<div class="item sp" data-id="'+l.id+'"></div>':'<div class="spc"></div>';
  h+=ed?'<div class="erow" data-lid="'+l.id+'"><button class="minus" data-minus="'+l.id+'" aria-label="삭제"></button>'+inner+'<span class="hd" data-hd="'+l.id+'">'+IC.grip+'</span></div>':(l.type?inner:inner.replace('<div class="item','<div class="item'));
 });
 h+='</div>'+(ed?'<div class="sb-bot ed"><button id="addGroup">그룹 추가하기</button><button id="addSpace">여백 추가하기</button></div>':'<div class="sb-bot"><button class="ico" id="sbUp">'+IC.up+'</button><button class="ico" id="sbMemo">'+IC.doc+'</button><button class="ico" id="sbAdd">'+IC.plus+'</button></div>')+'</div>';
 $('#sb').innerHTML=h;
}
/* ---------- render: rows ---------- */
function rowH(t,showDate){
 const t0=today();
 const sub=[(t.date&&t.date<t0&&!t.done)?'지연 '+md(t.date):(showDate&&t.date?md(t.date):''),S.set.showMemo&&t.memo?t.memo.split('\n')[0]:'',t.context?'@'+t.context:'',(t.tags||[]).map(x=>'#'+x).join(' '),t.subs&&t.subs.length?'세부 '+t.subs.filter(s=>s.done).length+'/'+t.subs.length:''].filter(Boolean).join('  ');
 return '<div class="row '+(t.done?'done':'')+(t.doing?' doing':'')+'" data-id="'+t.id+'"><button class="circ" data-chk="'+t.id+'" aria-label="완료"><i></i></button><div class="rb"><div class="tt">'+esc(t.title)+'</div>'+(sub?'<div class="sub2">'+esc(sub)+'</div>':'')+'</div>'+(t.priority?'<span class="pr p'+t.priority+'">'+'!'.repeat(t.priority)+'</span>':'')+(t.time?'<span class="tm">'+t12(t.time)+'</span>':'')+'</div>';
}

function columns(){

 const last=addDays(t0,7);
 for(let i=0;i<8;i++){
  const d=addDays(t0,i);
  let ts=S.tasks.filter(t=>match(t)&&(t.date===d||(i===0&&t.date&&t.date<t0&&!t.done)));
  cols.push({label:i===0?'오늘':i===1?'내일':i+'일 후',sub:md(d),date:d,tasks:ts.sort(sortT)});
 }
 cols.push({label:NODATE,sub:'',date:null,tasks:S.tasks.filter(t=>match(t)&&!t.date).sort(sortT)});

}

const ROW=108;
function renderCal(v){
 const t0=today();
 const old=$('#cscroll');const oldTop=old?old.scrollTop:null;
 const first=mondayOf(addDays(t0,-140)),N=80;
 const map={};S.tasks.forEach(t=>{if(t.date&&match(t)){(map[t.date]=map[t.date]||[]).push(t)}});
 let rows='';
 for(let w=0;w<N;w++){
  const ws=addDays(first,w*7);let cells='',mb=false;
  for(let i=0;i<7;i++){
   const s=addDays(ws,i),d=parse(s),dd=d.getDate(),mm=d.getMonth()+1;
   if(dd===1)mb=true;
   const ts=(map[s]||[]).sort(sortT);
   const show=ts.length>4?3:ts.length;
   const chips=ts.slice(0,show).map(t=>'<div class="cchip '+(t.done?'dn':'')+'" data-id="'+t.id+'">'+(t.done?IC.chk2:IC.ring)+'<span>'+(t.priority?'!'.repeat(t.priority)+' ':'')+esc(t.title)+'</span></div>').join('')+(ts.length>show?'<div class="cmore">+'+(ts.length-show)+'</div>':'');
   const n=s===t0?'<span class="n td">'+mm+'월 '+dd+'일</span>':dd===1?'<span class="n f">'+mm+'월 1일</span>':'<span class="n">'+dd+'</span>';
   cells+='<div class="cd'+(i>=5?' we':'')+(dd===1?' f':'')+'" data-cal="'+s+'">'+n+chips+'</div>';
  }
  rows+='<div class="wk'+(mb?' mb':'')+'" data-w="'+ws+'">'+cells+'</div>';
 }
 v.innerHTML='<div class="calbar"><b id="calM" style="font-weight:400"></b><button data-calnav="today">이번 달</button></div><div class="cwk">'+'월화수목금토일'.split('').map(x=>'<div>'+x+'</div>').join('')+'</div><div class="cscroll" id="cscroll">'+rows+'</div>';

 sc.scrollTop=(oldTop!=null&&S.calInit)?oldTop:monthTop();S.calInit=true;

 upd();sc.addEventListener('scroll',upd,{passive:true});
 sc._top=monthTop;
}

 q('#dDate').onclick=pickDate;q('#iDate').onclick=pickDate;
 q('#dAlarm').onclick=pickAlarm;q('#iAuto').onclick=pickAlarm;
 q('#iAlarm').onclick=()=>{if(needDate()){d.alarm=!d.alarm;sync()}};
 q('#iTag').onclick=askTag;
 q('#iPin').onclick=()=>ask('맥락 (장소·상황 등)',d.context,v=>{d.context=v;sync()});
 q('#mExp').onclick=()=>{const m=q('#mMemo');m.style.height=m.style.height==='260px'?'':'260px'};
 q('#mRc').onclick=()=>{hideDoneSubs=!hideDoneSubs;sync()};
 q('#mChk').onclick=()=>{d.done=!d.done;sync()};
 q('#mPrio').onclick=e=>{const b=e.target.closest('[data-p]');if(b){d.priority=+b.dataset.p;sync()}};
 q('#mChip').onclick=pickList;
 q('#mTitle').oninput=sync;
 q('#mTitle').onkeydown=e=>{if(e.key==='Enter')submit()};
 q('#mMemo').oninput=()=>{d.memo=q('#mMemo').value};
 q('#mSubs').onclick=e=>{const t=e.target.closest('[data-t]');if(t){d.subs[+t.dataset.t].done=!d.subs[+t.dataset.t].done;sync();return}const x=e.target.closest('[data-x]');if(x){d.subs.splice(+x.dataset.x,1);sync()}};
 q('#mSubIn').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim()){d.subs.push({title:e.target.value.trim(),done:false});e.target.value='';sync()}};
 function submit(){
  const title=q('#mTitle').value.trim();if(!title){q('#mTitle').focus();return}
  const sv=q('#mSubIn').value.trim();if(sv)d.subs.push({title:sv,done:false});
  d.title=title;d.memo=q('#mMemo').value;if(!d.date)d.alarm=false;
  if(editing)Object.assign(editing,d);else S.tasks.push(Object.assign({id:uid(),c:Date.now()},d));
  save();close();renderAll();
 }
 q('#mOk').onclick=submit;q('#mX').onclick=close;
 ov.addEventListener('mousedown',e=>{if(e.target===ov)close()});
 if(editing)q('#mDel').onclick=()=>{S.tasks=S.tasks.filter(t=>t!==editing);save();close();renderAll()};
 sync();setTimeout(()=>q('#mTitle').focus(),50);
}
/* ---------- alarms ---------- */
const fired=new Set();
setInterval(()=>{const n=new Date(),hm=pad(n.getHours())+':'+pad(n.getMinutes());
 S.tasks.forEach(t=>{if(t.done||!t.alarm||t.date!==today()||t.alarmAt!==hm)return;const k=t.id+t.date+hm;if(fired.has(k))return;fired.add(k);toast('알람: '+t.title)})},15000);
/* ---------- init ---------- */
load();
if(!ICOL[S.set.icon])S.set.icon='white';applyIcon();if(!['board','cal','list'].includes(S.set.mode))S.set.mode='board';S.mode=S.set.mode;
if(innerWidth<600||innerHeight>innerWidth)S.sb=false;
fit();renderAll();
addEventListener('resize',()=>{fit()});
/* ---------- 앱 설치 · 오프라인 ---------- */
(()=>{
 const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
 const ua=navigator.userAgent,isIOS=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 const inApp=/KAKAOTALK|Instagram|FBAN|FBAV|Line\/|NAVER\(inapp|DaumApps/i.test(ua);
 const DK='todo-install-dismissed';
 let off=false;try{off=Date.now()-(+localStorage.getItem(DK)||0)<7*864e5}catch(e){}
 if(isIOS&&!standalone&&!off){
  const b=document.createElement('div');b.id='inst';
  const share='<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M7 10H5.5A1.5 1.5 0 004 11.5v8A1.5 1.5 0 005.5 21h13a1.5 1.5 0 001.5-1.5v-8a1.5 1.5 0 00-1.5-1.5H17"/></svg>';
  b.innerHTML=share+'<span>'+(inApp?'Safari로 열면 앱으로 설치할 수 있어요':'공유 → <b>홈 화면에 추가</b>로 앱처럼 설치하세요')+'</span><button aria-label="닫기">×</button>';
  b.querySelector('button').onclick=()=>{b.hidden=true;try{localStorage.setItem(DK,Date.now())}catch(e){}};
  document.body.appendChild(b);
 }
 if('serviceWorker' in navigator&&location.protocol==='https:'){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  const had=!!navigator.serviceWorker.controller;let done=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!done){done=true;save();location.reload()}});
 }
})();
</script>
</body>
